name: Reworked validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tests/check_syntax.py
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint and build the module page
        run: docker run --rm -v "$PWD:/usr/src" -w /usr/src/ui docker.io/library/node:24.22.2 sh -c "corepack enable && yarn install --immutable && yarn lint && yarn build"
