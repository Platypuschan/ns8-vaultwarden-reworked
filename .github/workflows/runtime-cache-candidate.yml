name: Build reviewed Rust runtime cache candidate
on:
  push:
    branches: [renovate/docker.io-library-rust-1.x]
    paths: [.github/workflows/runtime-cache-candidate.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y podman skopeo
      - name: Compile locked source and publish candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          recipe="$(.github/scripts/runtime-tag)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vaultwarden-reworked-server:$recipe"
          podman build --layers -t "$image" -f prototype/vaultwarden/Containerfile prototype/vaultwarden
          podman run --rm --entrypoint /vaultwarden "$image" --version
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push "$image"
          skopeo inspect "docker://$image"
